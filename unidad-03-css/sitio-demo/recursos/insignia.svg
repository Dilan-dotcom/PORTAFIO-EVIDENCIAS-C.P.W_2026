<svg width="200" height="200" viewBox="0 0 200" xmlns="http://www.w3.org/2000/svg">
              <!--circle se ubica por su centro cx y cy y su radio es r-->
              <circle cx="100" cy="100" r="90" fill="#c55a11"></circle>

              <circle cx="100" cy="100" r="72" fill="#FFF8E1" stroke="#1f4e79"></circle>

              <!--polygon lista de verticesx:la figura se cierra sola-->
              <polygon points="100,45 112,80 149,80 119,102 130,137 100,115 70,137 81,102 51,80 88,80" fill="#f5c518" stroke="#1f4e79" stroke-width="3"></polygon>
              <!--text:codigo para crear texto svg-->
              <text x="100" y="150" text-anchor="middle" font-size="14" fill="#1f4e79">
                HTML
              </text>
            </svg>